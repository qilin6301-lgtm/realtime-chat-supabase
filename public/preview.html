<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Chat · Layout Preview</title>
  <style>
    :root{--bg:#08111c;--panel:#0e1b29;--panel-2:#122336;--line:#203447;--text:#f4f8fb;--muted:#8da0b2;--brand:#48b8f4;--brand-2:#268fd1;--green:#54d68b;--pink:#f18baa;--bubble:#18324a;--shadow:0 24px 70px rgba(0,0,0,.34)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#163958 0,#08111c 42%);color:var(--text);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}.shell{height:100vh;max-width:1440px;margin:auto;display:grid;grid-template-columns:72px 330px minmax(0,1fr);background:rgba(8,17,28,.78);box-shadow:var(--shadow)}.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:22px;background:rgba(6,15,25,.8)}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#796bff);display:grid;place-items:center;font-size:21px;font-weight:800;box-shadow:0 10px 25px #229ee955}.rail-btn{width:42px;height:42px;border:0;border-radius:13px;background:transparent;color:var(--muted);font-size:19px;cursor:pointer}.rail-btn.active,.rail-btn:hover{background:#1b3851;color:#fff}.rail-spacer{flex:1}.list{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(17,34,50,.98),rgba(11,24,37,.98));display:flex;flex-direction:column;min-width:0}.list-head{padding:22px 20px 14px}.eyebrow{color:var(--brand);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.list-title{font-size:24px;font-weight:800;margin-top:5px}.search{margin-top:17px;background:#0a1826;border:1px solid var(--line);height:40px;border-radius:12px;color:var(--muted);display:flex;align-items:center;padding:0 12px;gap:8px}.search span{opacity:.72}.tabs{display:flex;gap:18px;padding:0 20px;border-bottom:1px solid var(--line)}.tab{padding:12px 0 11px;color:var(--muted);font-size:13px}.tab.active{color:#fff;border-bottom:2px solid var(--brand)}.threads{overflow:auto;padding:8px}.thread{display:flex;gap:11px;padding:12px;border-radius:14px;cursor:pointer}.thread:hover,.thread.active{background:linear-gradient(90deg,#1d3e59,#173049)}.avatar{width:44px;height:44px;flex:none;border-radius:15px;display:grid;place-items:center;font-weight:800;color:#052035;background:linear-gradient(135deg,#65d5ff,#4aa9eb);position:relative}.avatar.pink{background:linear-gradient(135deg,#ffc3d2,#ee83a6)}.avatar.green{background:linear-gradient(135deg,#9bf1b7,#52c995)}.dot{width:10px;height:10px;border:2px solid var(--panel);border-radius:50%;background:var(--green);position:absolute;right:-2px;bottom:-1px}.thread-main{min-width:0;flex:1}.thread-row{display:flex;justify-content:space-between;gap:8px}.thread-name{font-weight:700}.thread-time,.thread-preview{color:var(--muted);font-size:12px}.thread-preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.unread{background:var(--brand);color:#062036;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:800}.chat{display:flex;flex-direction:column;min-width:0;background:radial-gradient(circle at 80% 10%,#17364f55,transparent 35%),#0a1622}.chat-head{height:76px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(13,29,44,.82);backdrop-filter:blur(12px)}.chat-head .avatar{width:42px;height:42px;border-radius:14px}.chat-person{min-width:0;flex:1}.chat-name{font-size:16px;font-weight:800}.status{font-size:12px;color:var(--green);margin-top:2px}.head-actions{display:flex;gap:7px}.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:11px;background:#13273a;color:var(--muted);cursor:pointer}.messages{flex:1;overflow:auto;padding:28px clamp(18px,6vw,84px);display:flex;flex-direction:column;gap:15px}.day{text-align:center;color:var(--muted);font-size:11px;margin:4px 0 7px}.msg{max-width:min(590px,78%);display:flex;gap:9px;align-items:flex-end}.msg.me{margin-left:auto;flex-direction:row-reverse}.mini-avatar{width:28px;height:28px;border-radius:10px;background:#245172;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}.bubble{padding:11px 14px;border-radius:16px 16px 16px 5px;background:var(--bubble);box-shadow:0 7px 18px #00000018}.me .bubble{background:linear-gradient(135deg,#278dc8,#2376b0);border-radius:16px 16px 5px 16px}.meta{font-size:10px;color:#a9bfd0;margin-top:5px;display:flex;gap:6px}.compose{padding:15px 28px 20px;display:flex;gap:10px;border-top:1px solid var(--line);background:rgba(11,25,38,.88)}.compose input{flex:1;border:1px solid var(--line);border-radius:15px;background:#0b1a29;color:#fff;padding:0 16px;height:46px;outline:none}.compose input:focus{border-color:var(--brand)}.send{height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:white;padding:0 20px;font-weight:800;cursor:pointer}.hint{padding:0 28px 11px;color:var(--muted);font-size:11px}@media(max-width:900px){.shell{grid-template-columns:62px minmax(0,1fr)}.list{display:none}.messages{padding:22px 18px}.chat-head{padding:0 17px}.compose{padding:12px 14px 16px}.hint{padding:0 14px 10px}}@media(max-width:560px){.shell{display:block}.rail{display:none}.chat-head{height:68px}.head-actions .icon-btn:nth-child(2){display:none}.messages{padding:18px 12px}.msg{max-width:88%}.compose{gap:7px}.compose input{min-width:0}.send{padding:0 15px}}
  </style>
</head>
<body>
  <main class="shell">
    <aside class="rail"><div class="logo">✦</div><button class="rail-btn active">▤</button><button class="rail-btn">⌂</button><button class="rail-btn">♙</button><button class="rail-btn">⚙</button><div class="rail-spacer"></div><button class="rail-btn">?</button><div class="avatar pink" style="width:38px;height:38px;border-radius:12px">L</div></aside>
    <aside class="list"><header class="list-head"><div class="eyebrow">Realtime Community</div><div class="list-title">消息</div><div class="search">⌕ <span>搜索联系人或消息</span></div></header><nav class="tabs"><div class="tab active">全部</div><div class="tab">未读 <b class="unread">2</b></div><div class="tab">收藏</div></nav><section class="threads"><div class="thread active"><div class="avatar">M<div class="dot"></div></div><div class="thread-main"><div class="thread-row"><span class="thread-name">Mia Chen</span><span class="thread-time">10:42</span></div><div class="thread-row"><span class="thread-preview">今天的照片很漂亮，谢谢你！</span><span class="unread">2</span></div></div></div><div class="thread"><div class="avatar pink">S<div class="dot"></div></div><div class="thread-main"><div class="thread-row"><span class="thread-name">Sophia</span><span class="thread-time">昨天</span></div><div class="thread-preview">期待下次见面</div></div></div><div class="thread"><div class="avatar green">E</div><div class="thread-main"><div class="thread-row"><span class="thread-name">Emma</span><span class="thread-time">周二</span></div><div class="thread-preview">你发送了一张图片</div></div></div></section></aside>
    <section class="chat"><header class="chat-head"><div class="avatar">M<div class="dot"></div></div><div class="chat-person"><div class="chat-name">Mia Chen</div><div class="status">● 在线 · 正在输入...</div></div><div class="head-actions"><button class="icon-btn">⌕</button><button class="icon-btn">⋯</button></div></header><section class="messages"><div class="day">今天 10:38</div><div class="msg"><div class="mini-avatar">M</div><div><div class="bubble">早上好！我看到你分享的动态了，周末去海边吗？<div class="meta"><span>10:38</span><span>✓✓</span></div></div></div></div><div class="msg me"><div class="mini-avatar" style="background:#8b6aa7">L</div><div><div class="bubble">好呀！我正好想换个地方放松一下。<div class="meta"><span>10:39</span><span>已读</span></div></div></div></div><div class="msg"><div class="mini-avatar">M</div><div><div class="bubble">太好了，那就这么定了！我来找一家安静的咖啡店。<div class="meta"><span>10:41</span></div></div></div></div><div class="msg me"><div class="mini-avatar" style="background:#8b6aa7">L</div><div><div class="bubble">期待见到你 😊<div class="meta"><span>10:42</span><span>已读</span></div></div></div></div></section><div class="hint">Mia Chen 正在输入…</div><form class="compose" onsubmit="return false"><button class="icon-btn">☺</button><button class="icon-btn">＋</button><input placeholder="输入消息…" /><button class="send">发送</button></form></section>
  </main>
</body>
</html>
